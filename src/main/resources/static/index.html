<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель тренировок</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
    <h1>Панель тренировок</h1>
</header>

<main class="layout">
    <section class="content">
        <div class="card">
            <div class="row row-between">
                <h2 id="section-title"></h2>
                <button class="btn btn-primary" id="create-btn">Добавить</button>
            </div>

            <div class="row">
                <input id="search-input" class="input" placeholder="Поиск по таблице" />
            </div>

            <div id="table-wrap"></div>
        </div>
        <section class="card reviews" aria-label="Отзывы пользователей">
            <div class="row row-between">
                <h2>Отзывы</h2>
            </div>
            <form id="review-form" class="review-form">
                <input class="input" name="author" placeholder="Ваше имя" maxlength="60" required />
                <input class="input" name="role" placeholder="Кто вы (например, спортсмен)" maxlength="80" required />
                <textarea class="input" name="text" placeholder="Ваш отзыв" rows="3" maxlength="240" required></textarea>
                <button class="btn btn-primary" type="submit">Добавить отзыв</button>
            </form>
            <div class="reviews-grid" id="reviews-list"></div>
        </section>
    </section>

    <aside class="sidebar" id="sidebar"></aside>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
