name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t training-project:${{ github.sha }} .

  healthcheck:
    name: Post-deploy healthcheck (Railway)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

    steps:
      - name: Wait for Railway auto-deploy
        run: sleep 45

      - name: Healthcheck with retries
        if: env.HEALTHCHECK_URL != ''
        run: |
          for i in {1..12}; do
            if curl -fsS "$HEALTHCHECK_URL"; then
              echo "Healthcheck passed"
              exit 0
            fi
            echo "Healthcheck attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Healthcheck failed after retries"
          exit 1