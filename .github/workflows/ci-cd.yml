name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Validate wrapper
        run: ./mvnw -N wrapper:wrapper -Dmaven=3.9.10

      - name: Build and run tests
        run: ./mvnw clean verify

      - name: Build Docker image
        run: docker build -t training-project:${{ github.sha }} .

  deploy:
    name: Deploy & Healthcheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is missing"
            exit 1
          fi
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL secret is missing"
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for deploy
        run: sleep 45

      - name: Healthcheck with retries
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for i in {1..10}; do
            if curl -fsS "$HEALTHCHECK_URL"; then
              echo "Healthcheck passed"
              exit 0
            fi
            echo "Healthcheck attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Healthcheck failed after retries"
          exit 1